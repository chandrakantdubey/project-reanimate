route:
  receiver: reanimate
  group_by: ['alertname', 'service', 'environment']
  group_wait: 5s
  group_interval: 10s
  repeat_interval: 30m

receivers:
  - name: reanimate
    webhook_configs:
      - url: http://host.docker.internal:4000/internal/alerts
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials_file: /etc/alertmanager/secrets/webhook-token
