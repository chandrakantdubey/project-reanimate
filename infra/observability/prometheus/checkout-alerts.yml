groups:
  - name: reanimate-checkout
    rules:
      - alert: CheckoutHigh5xx
        expr: |
          (
            sum(rate(checkout_requests_total{status_code=~"5.."}[1m]))
            /
            clamp_min(sum(rate(checkout_requests_total[1m])), 0.001)
          ) > 0.20
          and sum(rate(checkout_requests_total[1m])) > 0.1
        for: 30s
        labels:
          service: checkout
          environment: demo
          severity: critical
        annotations:
          summary: Checkout errors exceed 20% for at least 30 seconds
          description: Investigate recent timeout changes and downstream payment failures
