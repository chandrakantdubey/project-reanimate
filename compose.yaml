# Development-only observability network. Run `node scripts/bootstrap-local.mjs` first.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: reanimate
      POSTGRES_DB: reanimate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run node scripts/bootstrap-local.mjs first}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - reanimate-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL','pg_isready -U reanimate -d reanimate']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ['redis-server','--appendonly','yes']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - reanimate-redis:/data

  prometheus:
    image: prom/prometheus:v3.2.1
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=2d'
    volumes:
      - ./infra/observability/prometheus:/etc/prometheus:ro
    ports:
      - '127.0.0.1:9090:9090'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on: [alertmanager]

  alertmanager:
    image: prom/alertmanager:v0.28.1
    command: ['--config.file=/etc/alertmanager/alertmanager.yml']
    volumes:
      - ./infra/observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./.local/webhook-token:/etc/alertmanager/secrets/webhook-token:ro
    ports:
      - '127.0.0.1:9093:9093'
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  tempo:
    image: grafana/tempo:2.7.2
    command: ['-config.file=/etc/tempo.yml']
    volumes:
      - ./infra/observability/tempo/tempo.yml:/etc/tempo.yml:ro
      - reanimate-tempo:/var/tempo
    ports:
      - '127.0.0.1:3200:3200'

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.121.0
    command: ['--config=/etc/otelcol/config.yml']
    volumes:
      - ./infra/observability/otel/collector.yml:/etc/otelcol/config.yml:ro
    ports:
      - '127.0.0.1:4317:4317'
      - '127.0.0.1:4318:4318'
    depends_on: [tempo]

volumes:
  reanimate-postgres: {}
  reanimate-redis: {}
  reanimate-tempo: {}
